<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>WhatsApp webhook test</title>
<style>
  body { font-family: ui-monospace, monospace; background:#111; color:#ddd; padding:24px; max-width:760px; margin:0 auto; }
  h1 { font-size:18px; }
  label { display:block; margin-top:14px; font-size:13px; color:#999; }
  input, textarea { width:100%; background:#1c1c1c; color:#eee; border:1px solid #333; padding:8px; font:inherit; box-sizing:border-box; }
  textarea { min-height:110px; }
  button { margin-top:16px; background:#3b82f6; color:#fff; border:0; padding:10px 16px; font:inherit; cursor:pointer; }
  pre { background:#0a0a0a; border:1px solid #333; padding:12px; white-space:pre-wrap; word-break:break-all; min-height:120px; }
  .cases { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .cases button { background:#333; margin-top:0; padding:6px 10px; font-size:12px; }
  .ok { color:#4ade80; } .bad { color:#f87171; }
</style>
</head>
<body>
<h1>WhatsApp webhook test — escapeXml + NIM trim</h1>

<label>Webhook URL — local harness: <code>node workers/webhook-cases.test.mjs --serve</code></label>
<input id="url" value="http://localhost:8788/api/whatsapp" />

<label>Body</label>
<div class="cases">
  <button data-case="amp">case: ampersand</button>
  <button data-case="trunc">case: truncated tag</button>
  <button data-case="both">case: both</button>
</div>
<textarea id="body">SAVE</textarea>

<label>Simulated NIM response (read by the local harness only — the production worker has no <code>__test_nim</code> hook)</label>
<textarea id="nim">Dentists lose ~$4k/mo to missed calls &amp; no-shows.
1. CAPTURE: forward after-hours calls to AI <2. CONVERT: books straight into your calendar
3. FOLLOW-UP: reminders cut no-shows</textarea>

<button id="send">Send test POST</button>
<h1 style="margin-top:24px">Result</h1>
<pre id="out">—</pre>

<script>
const AMP = "Dentists lose ~$4k/mo to missed calls & no-shows.\n1. CAPTURE: forward after-hours calls to AI ";
const TRUNC = "1. CAPTURE: forward after-hours calls to AI <2. CONVERT: books straight into your calendar";
const BOTH = AMP + "<b>broken";

document.querySelectorAll('.cases button').forEach(b => {
  b.onclick = () => {
    const c = b.dataset.case;
    document.getElementById('nim').value = c === 'amp' ? AMP : c === 'trunc' ? TRUNC : BOTH;
    document.getElementById('body').value = 'SAVE';
  };
});

document.getElementById('send').onclick = async () => {
  const out = document.getElementById('out');
  out.textContent = 'sending...';
  const fd = new FormData();
  fd.append('From', 'whatsapp:+5521999340899');
  fd.append('Body', document.getElementById('body').value);
  fd.append('MessageSid', 'SM_test_' + Date.now());
  fd.append('__test_nim', document.getElementById('nim').value);
  try {
    const r = await fetch(document.getElementById('url').value, { method: 'POST', body: fd });
    const t = await r.text();
    const badAmp = /&(?!(amp|lt|gt|quot|apos|#)/.test(t);
    const badTag = /<(?!\/?(Response|Message)\b|\?xml)/.test(t);
    out.innerHTML = '';
    out.append(`status ${r.status}\n\n`);
    out.append(t + '\n\n');
    out.append(badAmp || badTag
      ? 'FAIL: ' + [badAmp && 'raw ampersand', badTag && 'raw tag'].filter(Boolean).join(', ')
      : 'PASS: xml is well-formed');
    out.className = badAmp || badTag ? 'bad' : 'ok';
  } catch (e) {
    out.textContent = 'error: ' + e;
    out.className = 'bad';
  }
};
</script>
</body>
</html>
